{% extends "account_profile_base.html" %}
{% load static %}
{% block pageTitle %}Change Password{% endblock %}

{% block content_sub %}
<h2 class="text-xl font-semibold mb-6">Change Password</h2>
<form action="{% url 'account:change_password' %}" method="post">
  {% csrf_token %}
  {% if error_message %}
  <p class="mb-4" style="font-size:13px;color:#ed4956;">{{ error_message }}</p>
  {% endif %}

  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Old Password</label>
    <input type="password" class="ig-input" name="old_password" required>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">New Password</label>
    <input type="password" class="ig-input" name="password" required>
  </div>
  <div class="mb-6">
    <label class="block text-sm font-semibold mb-1">Confirm New Password</label>
    <input type="password" class="ig-input" name="password_repeat" required>
  </div>

  <button type="submit" class="ig-btn-blue" style="width:auto;padding:7px 24px;">Change Password</button>
</form>
{% endblock %}

{% block my_scripts %}{% endblock %}
