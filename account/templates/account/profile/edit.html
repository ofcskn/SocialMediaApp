{% extends "account_profile_base.html" %}
{% load static %}
{% block pageTitle %}Edit Profile{% endblock %}

{% block content_sub %}
<h2 class="text-xl font-semibold mb-6">Edit Profile</h2>
<form action="{% url 'account:profile' %}" method="post">
  {% csrf_token %}
  {% if error_message %}
  <p class="mb-4" style="font-size:13px;color:#ed4956;">{{ error_message }}</p>
  {% endif %}

  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">First Name</label>
    <input type="text" class="ig-input" name="first_name" value="{{ data.first_name }}" required>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Last Name</label>
    <input type="text" class="ig-input" name="last_name" value="{{ data.last_name }}" required>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Email</label>
    <input type="email" class="ig-input" name="email" value="{{ data.email }}" required>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Username</label>
    <input type="text" class="ig-input" name="username" value="{{ data.username }}" required>
  </div>
  <div class="mb-4">
    <label class="block text-sm font-semibold mb-1">Bio</label>
    <textarea rows="4" maxlength="2048" class="ig-input" name="about_me"
      style="resize:vertical;">{{ data.about_me }}</textarea>
  </div>
  <div class="mb-6">
    <label class="block text-sm font-semibold mb-1">Website</label>
    <input type="text" class="ig-input" name="website_url" value="{{ data.website_url }}" maxlength="256">
  </div>

  <button type="submit" class="ig-btn-blue" style="width:auto;padding:7px 24px;">Submit</button>
</form>
{% endblock %}

{% block my_scripts %}{% endblock %}
