{% load static %}

<a href="{% url 'core:get_user' user_name=user.username %}"
  class="flex items-center gap-3 py-1">
  {% if user.avatar %}
    <img class="w-10 h-10 rounded-full object-cover border border-ig-border flex-shrink-0"
      src="/media/{{ user.avatar }}"
      alt="{{ user.username }}">
  {% else %}
    <div class="w-10 h-10 rounded-full border border-ig-border flex items-center justify-center text-sm font-bold text-white flex-shrink-0"
      style="background:var(--ig-blue, #0095f6);">
      {{ user.username|slice:":2"|upper }}
    </div>
  {% endif %}
  <div>
    <p class="text-sm font-semibold leading-none mb-0.5" style="color:#262626;">{{ user.username }}</p>
    <p class="text-xs leading-none" style="color:var(--ig-text-secondary);">{{ user.first_name }} {{ user.last_name }}</p>
  </div>
</a>
