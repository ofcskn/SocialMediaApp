{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block pageTitle %}{% endblock %} | Socipoki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ig-bg':        '#fafafa',
            'ig-border':    '#dbdbdb',
            'ig-blue':      '#0095f6',
            'ig-secondary': '#8e8e8e',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-ig-bg min-h-screen flex items-center justify-center py-10"
  style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#262626;">
  <div class="w-full max-w-[350px] px-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
