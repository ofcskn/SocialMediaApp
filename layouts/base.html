{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block pageTitle %}{% endblock %} | Socipoki</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ig-bg':        '#fafafa',
            'ig-border':    '#dbdbdb',
            'ig-blue':      '#0095f6',
            'ig-red':       '#ed4956',
            'ig-secondary': '#8e8e8e',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-ig-bg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#262626;">

  {% include "partials/_navbar.html" %}

  <main class="md:ml-[244px] pb-16 md:pb-0 min-h-screen">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/_footer.html" %}
  {% include "partials/_modals.html" %}
  {% block my_modals %}{% endblock %}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  {% block my_scripts %}{% endblock %}

  <script>
    /* ---- Comment helpers ---- */
    var send_comment_function = function(e, $formDiv) {
      var $url  = $formDiv.find("button.send_comment_btn").data("url");
      var $inp  = $formDiv.find("input[name='comment_content']");
      $.ajax({
        url: $url, method: "POST",
        data: { csrfmiddlewaretoken: '{{ csrf_token }}', content: $inp.val() },
        success: function(data) {
          if (data === "not-valid") { $formDiv.addClass("was-validated"); return; }
          var section = $formDiv.closest(".comments_section_of_post");
          var list    = section.find(".comments_of_post");
          list.prepend(data);
          list.find(".no_comments_alert").remove();
          $inp.val("");
        }
      });
    };

    $(".send_comment_btn").on("click", function(e) {
      send_comment_function(e, $(this).closest(".send_comment_div"));
    });
    $(".send_comment_div input").on("keypress", function(e) {
      if (e.which === 13) send_comment_function(e, $(this).closest(".send_comment_div"));
    });

    $(".post_comment__delete_btn").on("click", function() {
      var $this = $(this), item = $this.closest(".post_comment__list__item_with_sub");
      $.ajax({
        url: $this.data("url"), method: "POST",
        data: { csrfmiddlewaretoken: '{{ csrf_token }}' },
        success: function(data) { if (data === "success") item.remove(); }
      });
    });

    $(".post_comment__edit_btn").on("click", function() {
      var $this = $(this), item = $this.closest(".post_comment__list__item");
      var textDiv = item.find(".post_comment__text");
      var text    = textDiv.find("span").text();
      textDiv.find("span").remove();
      if (!textDiv.find("input[name='content']").length)
        $('<input>').attr({ type:'text', name:'content', class:'editable_comment__input', value: text }).appendTo(textDiv);
      if (!textDiv.find("input[name='url']").length)
        $('<input>').attr({ type:'hidden', name:'url', value: $this.data("url") }).appendTo(textDiv);
    });

    $("body").delegate(".editable_comment__input", "keydown", function(e) {
      var $this   = $(this);
      var withSub = $this.closest(".post_comment__list__item_with_sub");
      var item    = withSub.find(".post_comment__list__item");
      var textDiv = item.find(".post_comment__text");
      var url     = item.find("input[name='url']").val();
      var content = item.find("input[name='content']").val();
      if (e.key === "Escape") {
        $this.remove(); $('<span>').appendTo(textDiv).text(content);
      } else if (e.which === 13) {
        $.ajax({
          url: url, method: "POST",
          data: { csrfmiddlewaretoken: '{{ csrf_token }}', content: content },
          success: function(data) {
            $this.remove();
            content = item.find("input[name='content']").val();
            if ($this.hasClass("reply")) withSub.find(".sub_comments_of_post").append(data);
            if (data === "success") $('<span>').appendTo(textDiv).text(content);
          }
        });
      }
    });

    $(".reply_comment__btn").on("click", function() {
      var $this = $(this), item = $this.closest(".post_comment__list__item");
      var textDiv = item.find(".post_comment__text");
      if (!textDiv.find("input[name='url']").length)
        $('<input>').attr({ type:'hidden', name:'url', value: $this.data("url") }).appendTo(textDiv);
      if (!textDiv.find("input[name='content']").length)
        $('<input>').attr({ type:'text', name:'content', class:'editable_comment__input reply', value:'', placeholder:'Your reply…' }).appendTo(textDiv);
    });

    /* ---- Like / Save ---- */
    $(".post_action__btn").click(function() {
      var $btn = $(this);
      if ($btn.hasClass("not_action")) return;
      $.ajax({
        url: $btn.data("url"), method: "POST",
        data: { csrfmiddlewaretoken: '{{ csrf_token }}' },
        success: function(data) {
          $btn.toggleClass("acted");
          var span = $btn.closest(".post_action__button").find(".post_action__num");
          var n = parseInt(span.text()) || 0;
          if (data === "acted")                   span.text(n + 1);
          else if (data === "canceled" && n > 0)  span.text(n - 1);
        }
      });
    });
  </script>
</body>
</html>
