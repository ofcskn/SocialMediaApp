{% load static %}

<div class="flex items-center justify-between px-4 py-3">
  <a href="{% url 'core:get_user' user_name=post.posted_user.username %}"
    class="flex items-center gap-3">
    {% if post.posted_user.avatar %}
      <img class="w-8 h-8 rounded-full object-cover border border-ig-border flex-shrink-0"
        src="/media/{{ post.posted_user.avatar }}"
        alt="{{ post.posted_user.username }}">
    {% else %}
      <div class="w-8 h-8 rounded-full border border-ig-border flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
        style="background:var(--ig-blue, #0095f6);">
        {{ post.posted_user.username|slice:":2"|upper }}
      </div>
    {% endif %}
    <span class="text-sm font-semibold text-black">{{ post.posted_user.username }}</span>
  </a>
  <span class="text-xs" style="color:var(--ig-text-secondary);">{{ post.created_date|date:"M j" }}</span>
</div>
